[project]
site_name = "Benchmark Documentation"
site_description = "Operational documentation for the sparse matrix-vector multiplication benchmark."
docs_dir = "docs"
site_dir = "site"
repo_name = "spmv-benchmark"
extra_css = ["assets/stylesheets/enterprise.css"]

nav = [
  { "Overview" = [
    { "Home" = "index.md" },
    { "Project Structure" = "structure.md" },
  ] },
  { "Benchmark" = [
    { "Methodology" = "methodology.md" },
    { "Platforms" = "platforms.md" },
    { "Matrices" = "matrices.md" },
    { "Running Benchmarks" = "running.md" },
  ] },
  { "Analysis" = [
    { "Analysis Pipeline" = "analysis.md" },
    { "Result Figures" = "results.md" },
  ] },
]

[project.theme]
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.top",
  "content.code.copy",
  "content.tabs.link",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
